services:
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - shared_build_data:/app/dist

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - shared_build_data:/usr/share/nginx/html
    depends_on:
      - frontend-builder
      - json-server

  json-server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend/server:/app
    command: npx --yes json-server --watch db.json --port 3001 --host 0.0.0.0
    ports:
      - "3001:3001"

volumes:
  shared_build_data:
    driver: local