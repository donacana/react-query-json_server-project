services:
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - shared_build_data:/app/dist

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - shared_build_data:/usr/share/nginx/html
    depends_on:
      - frontend-builder
      - json-server

  json-server:
    build:
      context: .
      dockerfile: Dockerfile-json
    ports:
      - "3001:3001"

volumes:
  shared_build_data:
    driver: local